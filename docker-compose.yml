# (선택) PostgreSQL 로 개발할 때만 사용. Docker 가 없으면 기본값 SQLite 로 개발하면 된다.
#   docker compose up -d
#   backend/.env 의 DATABASE_URL 을 postgresql+psycopg://erp:erp@localhost:5432/erp 로 변경
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - erp-db:/var/lib/postgresql/data

volumes:
  erp-db:
